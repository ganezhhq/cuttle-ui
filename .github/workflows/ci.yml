name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint reads the commits in this push or pull request
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Check commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec commitlint --from "$FROM" --to "$TO" --verbose
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @cuttle-ui/playground exec playwright install --with-deps chromium
      - run: pnpm --filter @cuttle-ui/playground test:e2e

  size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: preactjs/compressed-size-action@v2
        with:
          pattern: 'packages/*/dist/**/*.js'
